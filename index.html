    <meta property="og:description" content="Paste your Canvas, Blackboard, or Google Calendar link and every assignment lands on one organized timeline. Free for students during beta." />
    <meta property="og:image" content="/walkthrough/tasks.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plannr - Never miss a due date again" />
    <meta name="twitter:description" content="Paste your Canvas, Blackboard, or Google Calendar link and every assignment lands on one organized timeline. Free for students during beta." />
    <meta name="twitter:image" content="/walkthrough/tasks.webp" />
