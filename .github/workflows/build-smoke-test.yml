name: Build smoke test (Windows + iOS Simulator)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same script used for local releases, minus publishing - unsigned build
      # is fine here, this job only proves the Windows installer still builds.
      - run: npm run electron:build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 7

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds dist/ and syncs it into the Xcode project (same as npm run
      # ios:build), then compiles for the simulator SDK with signing off -
      # no Apple Developer account needed for this.
      - run: npm run ios:build

      - name: Compile for iOS Simulator (unsigned)
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild build \
            -project App.xcodeproj \
            -target App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Boot Simulator, install & launch the app
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH=$(find "$RUNNER_TEMP/build" -maxdepth 6 -name "App.app" -print -quit)
          echo "Installing $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

          xcrun simctl launch "$UDID" com.plannr.app
          sleep 8

          # If the app crashed on launch it drops out of the running-process
          # list within a few seconds - this is a best-effort check, not a
          # full UI test.
          if xcrun simctl spawn "$UDID" launchctl list | grep -q com.plannr.app; then
            echo "App launched and is still running."
          else
            echo "App is not present in the running process list - it may have crashed on launch."
            exit 1
          fi
